syntax = "proto3";

package info;

option go_package = "github.com/pbrpc/connect-protos/info";

// InfoService reports facts about the running server.
service InfoService {
  // Version reports the running server's version.
  rpc Version(VersionRequest) returns (VersionResponse);
}

// VersionRequest asks for the version.
message VersionRequest {}

// VersionResponse carries the version.
message VersionResponse {
  // The version the server was started with.
  string version = 1;
}
