syntax = "proto3";

package diagnostics;

option go_package = "github.com/pbrpc/connect-protos/diagnostics";

// DiagnosticsService reports on the dependencies a service holds.
service DiagnosticsService {
  // GetDiagnostics checks every dependency and reports each one.
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (GetDiagnosticsResponse);
}

// GetDiagnosticsRequest asks for every dependency.
message GetDiagnosticsRequest {}

// GetDiagnosticsResponse carries one report per dependency.
message GetDiagnosticsResponse {
  // Each dependency's report, keyed by the name the service gives it.
  map<string, ServiceDependency> services = 1;
}

// ServiceDependency is one dependency as it was when last checked.
message ServiceDependency {
  // Address the dependency was reached at, when known.
  string address = 1;

  // Whether the dependency could be reached: REACHABLE when the health call
  // was answered, UNREACHABLE when it was not.
  string state = 2;

  // The dependency's own answer to its health check, a
  // grpc.health.v1.HealthCheckResponse.ServingStatus name; UNKNOWN when it
  // could not be asked.
  string serving = 3;

  // When this dependency was last checked, as a UNIX timestamp in seconds.
  int64 last_checked = 4;

  // Further details the check chose to report, as key-value pairs.
  map<string, string> details = 5;
}
